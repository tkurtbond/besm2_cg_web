# Made up, for TestWindow (PLAN.md, Part B, step 6): a mecha before
# the character, so the window shows the second entity, which spends
# all its Character Points; every number as the rules compute it, so
# loading it says nothing.  TestWindow opens a copy, in ../obj, so a
# File > Save gone wrong can't change it.
- name: Walker
  mecha: true
  attributes:
    - {name: Heavy Armour, level: 1, points: 4}
- name: Pilot
  tagline: Test pilot
  creation:
    character-points: 20
    genre: Modern Military
    skill-points: 20
  stats:
    - {name: Body, value: 5, points: 5}
    - {name: Mind, value: 4, points: 4}
    - {name: Soul, value: 4, points: 4}
  attributes:
    - {name: Own a Big Mecha, subject: Walker, level: 1, points: 4}
    - {name: Heavy Armour, level: 1, points: 4}
  defects:
    - {name: Unique Character Defect, subject: Stubborn, level: 1, points: -1}
  skills:
    - {name: Driving, level: 2, points: 8}
